<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Azura — Open World Crime</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; height: 100%; overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #game { display: block; width: 100vw; height: 100vh; background: #1a2b4a; }
  .panel { position: absolute; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7);
    pointer-events: none; user-select: none; }
  #topbar { top: 12px; left: 14px; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  #topbar .sub { font-size: 13px; font-weight: 400; opacity: .9; }
  #wanted { top: 12px; left: 50%; transform: translateX(-50%); font-size: 30px; letter-spacing: 4px;
    color: #ffd23f; text-shadow: 0 0 8px rgba(0,0,0,.8); }
  #cash { top: 12px; right: 14px; text-align: right; font-size: 20px; font-weight: 700; }
  #cash .sub { font-size: 13px; font-weight: 400; }
  #objective { top: 64px; right: 14px; width: 300px; background: rgba(8,14,30,.72);
    border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 10px 12px; }
  #objective h3 { margin: 0 0 4px; font-size: 14px; color: #ffd23f; letter-spacing: 1px;
    text-transform: uppercase; }
  #objective p { margin: 0; font-size: 14px; line-height: 1.45; }
  #objective .dist { margin-top: 6px; font-size: 12px; color: #9fd8ff; }
  #messages { left: 50%; bottom: 118px; transform: translateX(-50%); width: 640px;
    text-align: center; font-size: 17px; font-weight: 600; }
  #messages div { margin-top: 4px; background: rgba(8,14,30,.66); border-radius: 8px;
    padding: 6px 10px; display: inline-block; }
  #hint { left: 14px; bottom: 12px; font-size: 13px; opacity: .92; line-height: 1.5; }
  #minimap { position: absolute; right: 14px; bottom: 12px; width: 220px; height: 168px;
    border: 2px solid rgba(255,255,255,.55); border-radius: 8px; background: #12203a;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #minilabel { right: 18px; bottom: 186px; font-size: 11px; letter-spacing: 2px; color: #cfe6ff; }
  #speedo { left: 14px; bottom: 96px; font-size: 15px; font-weight: 700; }
  #screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(6,18,44,.88), rgba(20,8,32,.82));
    color: #fff; text-align: center; z-index: 5; }
  #screen .card { max-width: 640px; padding: 28px 34px; }
  #screen h1 { margin: 0; font-size: 54px; letter-spacing: 4px; color: #ffd23f;
    text-shadow: 0 3px 0 #b3541e, 0 6px 18px rgba(0,0,0,.6); }
  #screen h2 { margin: 6px 0 14px; font-size: 18px; font-weight: 400; color: #9fd8ff; letter-spacing: 2px; }
  #screen p { font-size: 15px; line-height: 1.6; color: #e8eefc; }
  #screen .controls { font-size: 13px; line-height: 1.9; color: #cfe0ff; }
  #screen button { pointer-events: auto; cursor: pointer; margin: 8px 6px 0; padding: 12px 26px;
    font-size: 17px; font-weight: 700; border: none; border-radius: 10px; color: #1a1206;
    background: linear-gradient(#ffe27a, #ffb52e); box-shadow: 0 4px 0 #a86a00; }
  #screen button:hover { filter: brightness(1.07); }
  #screen button.ghost { background: rgba(255,255,255,.14); color: #fff; box-shadow: none;
    border: 1px solid rgba(255,255,255,.5); }
  #toast { left: 50%; top: 110px; transform: translateX(-50%); font-size: 26px; font-weight: 800;
    color: #ffd23f; letter-spacing: 2px; display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="topbar" class="panel"></div>
  <div id="wanted" class="panel"></div>
  <div id="cash" class="panel"></div>
  <div id="objective" class="panel"><h3 id="objTitle">Port Azura</h3><p id="objText"></p><div class="dist" id="objDist"></div></div>
  <div id="messages" class="panel"></div>
  <div id="toast" class="panel"></div>
  <div id="speedo" class="panel"></div>
  <div id="hint" class="panel">WASD drive / walk &nbsp;·&nbsp; E enter car &nbsp;·&nbsp; Mouse aim, Click shoot &nbsp;·&nbsp; F punch<br>Shift sprint &nbsp;·&nbsp; Space handbrake &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute &nbsp;·&nbsp; S save</div>
  <div id="minilabel" class="panel">PORT AZURA</div>
  <canvas id="minimap" width="220" height="168"></canvas>
  <div id="screen"><div class="card" id="screenCard"></div></div>
</div>
<script src="src/rng.js"></script>
<script src="src/city.js"></script>
<script src="src/audio.js"></script>
<script src="src/player.js"></script>
<script src="src/traffic.js"></script>
<script src="src/police.js"></script>
<script src="src/missions.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
</body>
</html>
